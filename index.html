<!doctype html><html lang="sv"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>TEETER 3.8</title><style>*{box-sizing:border-box}body{margin:0;background:#17152b;color:white;font:16px system-ui;touch-action:none;overscroll-behavior:none}main{height:100dvh;display:flex;flex-direction:column;padding:8px;gap:6px;max-width:950px;margin:auto}header{display:flex;justify-content:space-between;color:#ffd17b;font-weight:bold}canvas{width:100%;flex:1;min-height:0;background:#29233e;border-radius:12px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px}.side{display:grid;grid-template-rows:84px 48px;gap:6px;min-width:0}button,.slide{border:0;border-radius:12px;color:white;font-weight:bold;font-size:16px;touch-action:none;user-select:none;-webkit-user-select:none}button{min-height:48px;background:#385d76}.blue{background:#45c6da;color:#10242e}.red{background:#ef7890;color:#391725}.slide,#twist{height:84px;background:#3b3454;position:relative;display:flex;align-items:center;justify-content:center}#track{position:absolute;right:22%;top:12px;bottom:12px;width:8px;background:#777;border-radius:8px}#knob{position:absolute;width:26px;height:26px;border-radius:50%;background:#ffd17b;left:50%;transform:translate(-50%,-50%);top:0%}.labels{position:absolute;left:8px;top:8px;bottom:8px;display:flex;flex-direction:column;justify-content:space-between;font-size:11px}#hint{text-align:center;font-size:13px;min-height:20px}button:active,#twist.on{filter:brightness(1.35)}header{align-items:center;font-size:13px}.scores{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px}.score{padding:5px 9px;border-radius:8px;background:#302943;text-align:center}.score b{display:block;font-size:20px}.arena{position:relative;flex:1;min-height:0;display:flex}.arena canvas{height:100%}#trick{position:absolute;top:38px;left:50%;transform:translateX(-50%);background:#17152bdd;border-radius:8px;padding:8px;white-space:nowrap;font-size:12px;pointer-events:none;opacity:0;transition:opacity .25s}#result{position:absolute;inset:0;background:#17152bee;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center}#result button{padding:0 24px}</style><main><header><span>TEETER 3.8</span><span id="height">HÖJD 0.0 m</span></header><div class="scores"><div class="score" style="color:#ef7890">RÖD TOTAL<b id="sr">0.0</b></div><div class="score">TID<b id="clock">60</b></div><div class="score" style="color:#45c6da">BLÅ TOTAL<b id="sb">0.0</b></div></div><div class="arena"><canvas id="c"></canvas><div id="trick"></div><div id="result"><strong>TIDEN ÄR SLUT</strong><h1 id="final"></h1><div id="detail"></div><div id="best"></div><button onclick="location.reload()">SPELA IGEN</button></div></div><div id="hint">Tryck blå eller röd för att börja</div><div class="controls"><div class="side"><button id="twist">⤾ SKRUV<br>Håll inne</button><button class="red" id="r">TRYCK RÖD</button></div><div class="side"><div class="slide" id="slide"><div class="labels"><span>STRÄCKT</span><span>VOLT</span><span>GRUPPERAD</span></div><div id="track"><div id="knob"></div></div></div><button class="blue" id="b">TRYCK BLÅ</button></div></div></main><script>
const $=id=>document.getElementById(id),c=$('c'),g=c.getContext('2d');let active=-1,phase='idle',h=0,v=0,peak=0,energy=5.0,angle=0,tw=0,tuck=0,target=0,held=false,board=0,boardTarget=0,wait=0,buffer=false,last=0,quality='',turns=0;let start=0,remaining=60,scores=[0,0],showUntil=0,now=0,launchAt=0,boardFrom=0,impact=[-100,-100];let audio;function unlockAudio(){try{audio ||= new (window.AudioContext||window.webkitAudioContext)();if(audio.state!=="running")audio.resume().catch(()=>{})}catch(e){}}function landingSound(power,success){if(!audio||audio.state!=="running")return;try{let t=audio.currentTime,n=Math.floor(audio.sampleRate*.15),b=audio.createBuffer(1,n,audio.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*Math.exp(-i/n*7);let src=audio.createBufferSource(),f=audio.createBiquadFilter(),gain=audio.createGain();src.buffer=b;f.type="lowpass";f.frequency.value=450;gain.gain.value=.25+.25*power/12;src.connect(f).connect(gain).connect(audio.destination);src.start(t);if(success){let o=audio.createOscillator(),z=audio.createGain();o.type="sine";o.frequency.value=1046.5;z.gain.setValueAtTime(.0001,t+.06);z.gain.exponentialRampToValueAtTime(.12,t+.075);z.gain.exponentialRampToValueAtTime(.0001,t+.28);o.connect(z).connect(audio.destination);o.start(t+.06);o.stop(t+.29)}}catch(e){}}function scoreLanding(){let f=Math.floor(Math.abs(angle)/(2*Math.PI)+1e-6),t=Math.floor(Math.abs(tw)/(2*Math.PI)+1e-6),p=f+t*.5;landingSound(peak,p>0);scores[active]+=p;$('sb').textContent=scores[0].toFixed(1);$('sr').textContent=scores[1].toFixed(1);$('trick').textContent=f+' VOLTER · '+t+' SKRUVAR · +'+p.toFixed(1);$('trick').style.opacity=1;showUntil=now+3000;impact[active]=now;}function finish(){phase='done';let total=scores[0]+scores[1],best=total;try{best=Math.max(total,Number(localStorage.getItem('teeterBest')||0));localStorage.setItem('teeterBest',best)}catch(e){}$('final').textContent=total.toFixed(1)+' POÄNG';$('detail').textContent='Röd '+scores[1].toFixed(1)+' · Blå '+scores[0].toFixed(1);$('best').textContent='Personbästa '+best.toFixed(1);$('result').style.display='flex';$('hint').textContent='Pass avslutat';}const G=3.0,colors=['#45c6da','#ef7890'];function launch(i,p){if(remaining<=0){finish();return}launchAt=now;impact[1-i]=now;active=i;phase='push';boardFrom=board;h=0;v=Math.sqrt(2*G*p);peak=p;angle=0;tw=0;boardTarget=i===0?-.30:.30;buffer=false;wait=0;$('height').textContent='HÖJD '+p.toFixed(1)+' m';$('hint').textContent=quality+' · '+(i===0?'BLÅ':'RÖD')+' i luften'}function press(i){unlockAudio();if(phase==='idle'){start=performance.now();quality='START';launch(1-i,energy);return}if(phase==='air'||phase==='push'){if(i===active){buffer=true;$('hint').textContent='Tryck registrerat – landning!'}return}if(phase==='contact'&&i===active){transfer(Math.max(0,1-wait/1.8));}}function transfer(q){let upright=Math.abs(Math.atan2(Math.sin(angle),Math.cos(angle)));let penalty=upright>1.0?.90:1;energy=Math.max(5,Math.min(12,(energy*(1.12+.20*q)+1.2*q)*penalty));quality=q>.75?'PERFEKT':q>.35?'BRA':'SENT';launch(1-active,energy)}function bind(el,down,up){el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);down(e)});for(let n of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(n,e=>{if(up)up(e)})}bind($('b'),()=>press(0));bind($('r'),()=>press(1));bind($('twist'),()=>{held=true;$('twist').classList.add('on')},()=>{held=false;$('twist').classList.remove('on')});let sid=null;function slide(e){let r=$('track').getBoundingClientRect();target=Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))}bind($('slide'),e=>{sid=e.pointerId;slide(e)},()=>{sid=null;target=0});$('slide').addEventListener('pointermove',e=>{if(e.pointerId===sid)slide(e)});window.addEventListener('blur',()=>{held=false;target=0;sid=null});function line(a,b,x,y,w,col){g.strokeStyle=col;g.lineWidth=w;g.lineCap='round';g.beginPath();g.moveTo(a,b);g.lineTo(x,y);g.stroke()}function person(x,y,i,rot,t,twist,scale,arm){g.save();g.translate(x,y);g.scale(scale,scale);g.translate(0,-35);g.rotate(rot);g.translate(0,35);let face=i===0?-1:1,cs=Math.cos(twist),sn=Math.sin(twist),width=.32+.68*Math.abs(cs),bend=t*19,hip=-37+bend,shoulder=hip-26,head=shoulder-11;g.scale(face,1);let skin='#ffd3ac',col=colors[i],back=cs<0;function limb(x1,y1,x2,y2,x3,y3,w,color){line(x1,y1,x2,y2,w,color);line(x2,y2,x3,y3,w*.85,color)}for(let k of [-1,1]){let off=k*4*width;limb(off,hip,off+9*t,-18,off,0,5,col);line(off,0,off+5,0,4,'#eee')}line(0,hip,3*t,shoulder,8*width,col);let spread=7*width;for(let k of [-1,1]){let ax=k*spread,elx=ax+Math.sin(arm)*12+sn*k*3,ely=shoulder+Math.cos(arm)*13;limb(ax,shoulder,elx,ely,elx+Math.sin(arm)*10,ely+Math.cos(arm)*13,4,skin)}g.fillStyle=skin;g.beginPath();g.ellipse(3*t,head,6*width,7,0,0,Math.PI*2);g.fill();g.fillStyle='#513b37';g.beginPath();g.ellipse(3*t,head-4,6*width,3,0,0,Math.PI*2);g.fill();if(!back){g.fillStyle='#392b2a';g.fillRect(3*t+sn*3-1,head,2,2)}else{line(-3*width,shoulder+6,3*width,shoulder+6,2,'#fff9')}g.restore()}function draw(){let r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio,2);if(c.width!==Math.round(r.width*d)||c.height!==Math.round(r.height*d)){c.width=Math.round(r.width*d);c.height=Math.round(r.height*d)}g.setTransform(d,0,0,d,0,0);let W=r.width,H=r.height;g.clearRect(0,0,W,H);let floor=H*.88,py=floor-28,half=W*.35,s=Math.min(1,W/370,H/250),unit=Math.max(1,(py-55)/Math.max(5,peak));g.fillStyle='#3d344e';g.fillRect(0,floor,W,H-floor);g.fillStyle='#9386aa';g.beginPath();g.moveTo(W/2,py);g.lineTo(W/2-22,floor);g.lineTo(W/2+22,floor);g.fill();g.save();g.translate(W/2,py);g.rotate(board);g.fillStyle='#e6b66c';g.fillRect(-half,-5,half*2,10);g.restore();for(let i=0;i<2;i++){let side=i===0?1:-1,x=W/2+side*half*.86*Math.cos(board),y=py+side*half*.86*Math.sin(board)-5;let flying=phase==='air'&&active===i;let a=flying?angle:0;let pose=flying?tuck:phase==='contact'&&active===i?.65:.12;let age=(now-launchAt)/1000,hit=(now-impact[i])/1000;let arm=flying?(v<0?Math.PI*Math.max(0,Math.min(1,h/1.5)):Math.PI*Math.min(1,age*12))*(1-.75*tuck):Math.max(0,Math.PI*(1-hit*12));if(phase==='push'&&active===i){let k=Math.min(1,age/.18);arm=Math.PI*k;pose=.45*(1-k)}if(!flying&&hit<.25)pose=Math.max(pose,.65*(1-hit/.25));person(x,y-(flying?h*unit:0),i,a,pose,flying?tw:0,s,arm)}if(phase==='air'&&v<0||phase==='contact'){g.fillStyle='#8ff0a9';g.font='bold 17px system-ui';g.textAlign='center';g.fillText('TRYCK '+(active===0?'BLÅ':'RÖD'),W/2,25)}$('knob').style.top=(tuck*100)+'%'}function tick(ts){let dt=Math.min(.25,Math.max(0,(ts-(last||ts))/1000));last=ts;now=ts;if(start&&phase!=='done'){remaining=Math.max(0,60-(ts-start)/1000);$('clock').textContent=Math.ceil(remaining);$('clock').style.color=remaining<=10?'#ef7890':'white';if(remaining<=0&&phase!=='air'&&phase!=='push')finish()}if(now>showUntil)$('trick').style.opacity=0;tuck+=(target-tuck)*Math.min(1,dt*18);if(phase==='push'){let k=Math.min(1,(now-launchAt)/180);board=boardFrom+(boardTarget-boardFrom)*k*k;if(k>=1){board=boardTarget;phase='air';launchAt=now;dt=0}}else{board+=(boardTarget-board)*Math.min(1,dt*14)}if(phase==='air'){let step=Math.min(dt,(v+Math.sqrt(Math.max(0,v*v+2*G*h)))/G);h+=v*step-.5*G*step*step;v-=G*step;angle+=(active===0?1:-1)*(.18+peak*.08)*(1+3.1*tuck)*step;if(held)tw+=step*(4.5+1.05*tuck);if(h<=1e-7&&v<0){h=0;scoreLanding();if(remaining<=0){finish();draw();requestAnimationFrame(tick);return}phase='contact';wait=0;boardTarget=active===0?.30:-.30;if(buffer)transfer(1);else $('hint').textContent='TRYCK '+(active===0?'BLÅ':'RÖD')+' NU!'}}else if(phase==='contact'){wait+=dt;if(wait>1.8){energy=Math.max(5,energy*.95);quality='MISSAD TIMING';launch(1-active,energy)}}draw();requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></html>
