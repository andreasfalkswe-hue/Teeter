<!doctype html><html lang="sv"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>TEETER 3.3</title><style>*{box-sizing:border-box}body{margin:0;background:#17152b;color:white;font:16px system-ui;touch-action:none;overscroll-behavior:none}main{height:100dvh;display:flex;flex-direction:column;padding:8px;gap:6px;max-width:950px;margin:auto}header{display:flex;justify-content:space-between;color:#ffd17b;font-weight:bold}canvas{width:100%;flex:1;min-height:0;background:#29233e;border-radius:12px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px}.side{display:grid;grid-template-rows:120px 54px;gap:6px;min-width:0}button,.slide{border:0;border-radius:12px;color:white;font-weight:bold;font-size:16px;touch-action:none;user-select:none;-webkit-user-select:none}button{min-height:48px;background:#385d76}.blue{background:#45c6da;color:#10242e}.red{background:#ef7890;color:#391725}.slide,#twist{height:120px;background:#3b3454;position:relative;display:flex;align-items:center;justify-content:center}#track{position:absolute;right:22%;top:12px;bottom:12px;width:8px;background:#777;border-radius:8px}#knob{position:absolute;width:26px;height:26px;border-radius:50%;background:#ffd17b;left:50%;transform:translate(-50%,-50%);top:0%}.labels{position:absolute;left:8px;top:8px;bottom:8px;display:flex;flex-direction:column;justify-content:space-between;font-size:11px}#hint{text-align:center;font-size:13px;min-height:20px}button:active,#twist.on{filter:brightness(1.35)}</style><main><header><span>TEETER 3.3</span><span id="height">HÖJD 0.0 m</span></header><canvas id="c"></canvas><div id="hint">Tryck blå eller röd för att börja</div><div class="controls"><div class="side"><button id="twist">⤾ SKRUV<br>Håll inne</button><button class="blue" id="b">TRYCK BLÅ</button></div><div class="side"><div class="slide" id="slide"><div class="labels"><span>STRÄCKT</span><span>VOLT</span><span>GRUPPERAD</span></div><div id="track"><div id="knob"></div></div></div><button class="red" id="r">TRYCK RÖD</button></div></div></main><script>
const $=id=>document.getElementById(id),c=$('c'),g=c.getContext('2d');let active=-1,phase='idle',h=0,v=0,peak=0,energy=3.0,angle=0,tw=0,tuck=0,target=0,held=false,board=0,boardTarget=0,wait=0,buffer=false,last=0,quality='',turns=0;const G=5.0,colors=['#45c6da','#ef7890'];function launch(i,p){active=i;phase='air';h=0;v=Math.sqrt(2*G*p);peak=p;angle=0;tw=0;boardTarget=i===0?.24:-.24;buffer=false;wait=0;$('height').textContent='HÖJD '+p.toFixed(1)+' m';$('hint').textContent=quality+' · '+(i===0?'BLÅ':'RÖD')+' i luften'}function press(i){if(phase==='idle'){quality='START';launch(1-i,energy);return}if(phase==='air'){if(i===active&&v<0){buffer=true;$('hint').textContent='Tryck registrerat – landning!'}return}if(phase==='contact'&&i===active){transfer(Math.max(0,1-wait/1.8));}}function transfer(q){let upright=Math.abs(Math.atan2(Math.sin(angle),Math.cos(angle)));let penalty=upright>1.0?.90:1;energy=Math.max(3,Math.min(14,(energy*(1.02+.16*q)+.65*q)*penalty));quality=q>.75?'PERFEKT':q>.35?'BRA':'SENT';launch(1-active,energy)}function bind(el,down,up){el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);down(e)});for(let n of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(n,e=>{if(up)up(e)})}bind($('b'),()=>press(0));bind($('r'),()=>press(1));bind($('twist'),()=>{held=true;$('twist').classList.add('on')},()=>{held=false;$('twist').classList.remove('on')});let sid=null;function slide(e){let r=$('track').getBoundingClientRect();target=Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))}bind($('slide'),e=>{sid=e.pointerId;slide(e)},()=>{sid=null;target=0});$('slide').addEventListener('pointermove',e=>{if(e.pointerId===sid)slide(e)});window.addEventListener('blur',()=>{held=false;target=0;sid=null});function line(a,b,x,y,w,col){g.strokeStyle=col;g.lineWidth=w;g.lineCap='round';g.beginPath();g.moveTo(a,b);g.lineTo(x,y);g.stroke()}function person(x,y,i,rot,t,twist,scale){g.save();g.translate(x,y);g.scale(scale,scale);g.rotate(rot);g.scale((i===0?1:-1)*(.35+.65*Math.abs(Math.cos(twist))),1);let knee=10+25*t,hip=-34+13*t,head=-65+20*t;line(0,0,knee,-17,7,colors[i]);line(knee,-17,0,hip,8,colors[i]);line(0,hip,7,head+12,12,colors[i]);line(6,head+16,20,head+30+12*t,6,'#ffd3ac');line(20,head+30+12*t,12+12*t,head+42,6,'#ffd3ac');g.fillStyle='#ffd3ac';g.beginPath();g.arc(9,head,9,0,7);g.fill();g.restore()}function draw(){let r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio,2);if(c.width!==Math.round(r.width*d)||c.height!==Math.round(r.height*d)){c.width=Math.round(r.width*d);c.height=Math.round(r.height*d)}g.setTransform(d,0,0,d,0,0);let W=r.width,H=r.height;g.clearRect(0,0,W,H);let floor=H*.88,py=floor-28,half=W*.35,s=Math.min(1,W/370,H/250),unit=Math.max(8,Math.min(65,(py-75)/Math.max(3,peak+0.3)));g.fillStyle='#3d344e';g.fillRect(0,floor,W,H-floor);g.fillStyle='#9386aa';g.beginPath();g.moveTo(W/2,py);g.lineTo(W/2-22,floor);g.lineTo(W/2+22,floor);g.fill();g.save();g.translate(W/2,py);g.rotate(board);g.fillStyle='#e6b66c';g.fillRect(-half,-5,half*2,10);g.restore();for(let i=0;i<2;i++){let side=i===0?-1:1,x=W/2+side*half*.86*Math.cos(board),y=py+side*half*.86*Math.sin(board)-5;let flying=phase==='air'&&active===i;let a=flying?angle:0;let pose=flying?tuck:phase==='contact'&&active===i?.65:.12;person(x,y-(flying?h*unit:0),i,a,pose,flying?tw:0,s)}if(phase==='air'&&v<0||phase==='contact'){g.fillStyle='#8ff0a9';g.font='bold 17px system-ui';g.textAlign='center';g.fillText('TRYCK '+(active===0?'BLÅ':'RÖD'),W/2,25)}$('knob').style.top=(tuck*100)+'%'}function tick(ts){let dt=Math.min(.035,(ts-(last||ts))/1000);last=ts;tuck+=(target-tuck)*Math.min(1,dt*18);board+=(boardTarget-board)*Math.min(1,dt*9);if(phase==='air'){v-=G*dt;h+=v*dt;angle+=(active===0?-1:1)*(.12+Math.max(0,peak-2)*.10)*(1+7*tuck)*dt;if(held)tw+=dt*(4+4*tuck);if(h<=0&&v<0){h=0;phase='contact';wait=0;boardTarget=active===0?-.24:.24;if(buffer)transfer(1);else $('hint').textContent='TRYCK '+(active===0?'BLÅ':'RÖD')+' NU!'}}else if(phase==='contact'){wait+=dt;if(wait>1.8){energy=Math.max(3,energy*.95);quality='MISSAD TIMING';launch(1-active,energy)}}draw();requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></html>
