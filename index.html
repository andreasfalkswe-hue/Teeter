const $=id=>document.getElementById(id),c=$('c'),g=c.getContext('2d');let active=-1,phase='idle',h=0,v=0,peak=0,energy=4.8,angle=0,tw=0,tuck=0,target=0,held=false,board=0,boardTarget=0,wait=0,buffer=false,bufferQuality=0,camera=1,last=0,quality='',turns=0;let start=0,remaining=60,scores=[0,0],showUntil=0,now=0,launchAt=0,boardFrom=0,impact=[-100,-100];let audio;function unlockAudio(){try{audio ||= new (window.AudioContext||window.webkitAudioContext)();if(audio.state!=="running")audio.resume().catch(()=>{})}catch(e){}}function landingSound(power,success){if(!audio||audio.state!=="running")return;try{let t=audio.currentTime,n=Math.floor(audio.sampleRate*.15),b=audio.createBuffer(1,n,audio.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*Math.exp(-i/n*7);let src=audio.createBufferSource(),f=audio.createBiquadFilter(),gain=audio.createGain();src.buffer=b;f.type="lowpass";f.frequency.value=450;gain.gain.value=.25+.25*power/12;src.connect(f).connect(gain).connect(audio.destination);src.start(t);if(success){let o=audio.createOscillator(),z=audio.createGain();o.type="sine";o.frequency.value=1046.5;z.gain.setValueAtTime(.0001,t+.06);z.gain.exponentialRampToValueAtTime(.12,t+.075);z.gain.exponentialRampToValueAtTime(.0001,t+.28);o.connect(z).connect(audio.destination);o.start(t+.06);o.stop(t+.29)}}catch(e){}}function scoreLanding(){let f=Math.floor(Math.abs(angle)/(2*Math.PI)+1e-6),t=Math.floor(Math.abs(tw)/(2*Math.PI)+1e-6),p=f+t*.5;landingSound(peak,p>0);scores[active]+=p;$('sb').textContent=scores[0].toFixed(1);$('sr').textContent=scores[1].toFixed(1);$('trick').textContent=f+' VOLTER · '+t+' SKRUVAR · +'+p.toFixed(1);$('trick').style.borderColor=colors[active];$('trick').style.opacity=1;showUntil=now+5000;impact[active]=now;}function finish(){phase='done';let total=scores[0]+scores[1],best=total;try{best=Math.max(total,Number(localStorage.getItem('teeterBest')||0));localStorage.setItem('teeterBest',best)}catch(e){}$('final').textContent=total.toFixed(1)+' POÄNG';$('detail').textContent='Röd '+scores[1].toFixed(1)+' · Blå '+scores[0].toFixed(1);$('best').textContent='Personbästa '+best.toFixed(1);$('result').style.display='flex';$('hint').textContent='Pass avslutat';}let menuOpen=true;try{$('menuBest').textContent='PERSONBÄSTA '+Number(localStorage.getItem('teeterBest')||0).toFixed(1)+' · 4.1'}catch(e){}$('startGame').addEventListener('click',()=>{unlockAudio();menuOpen=false;$('menu').classList.add('leaving');setTimeout(()=>$('menu').remove(),350)});const G=4.14,colors=['#45c6da','#ef7890'];function launch(i,p){if(remaining<=0){finish();return}launchAt=now;impact[1-i]=now;active=i;phase='push';boardFrom=board;h=0;v=Math.sqrt(2*G*p);peak=p;angle=0;tw=0;tuck=0;boardTarget=i===0?-.30:.30;buffer=false;bufferQuality=0;wait=0;$('height').textContent='HÖJD '+p.toFixed(1)+' m';$('hint').textContent=quality+' · '+(i===0?'BLÅ':'RÖD')+' i luften'}function press(i){if(menuOpen)return;unlockAudio();if(phase==='idle'){start=performance.now();quality='START';launch(1-i,energy);return}if(phase==='air'||phase==='push'){if(i===active){buffer=true;bufferQuality=phase==='air'?Math.max(0,1-Math.max(0,(v+Math.sqrt(Math.max(0,v*v+2*G*h)))/G-.22)/.9):0;$('hint').textContent='Tryck registrerat – landning!'}return}if(phase==='contact'&&i===active){transfer(Math.max(0,1-wait/.85));}}function transfer(q){let upright=Math.abs(Math.atan2(Math.sin(angle),Math.cos(angle)));let penalty=upright>1.0?.90:1;energy=Math.max(3.5,Math.min(12,(energy+ (q>.8?2.4:q>.5?1.2:q>.3?0:-2.8*(1-q)))*penalty));quality=q>.75?'PERFEKT':q>.35?'BRA':'SENT';launch(1-active,energy)}function bind(el,down,up){el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);down(e)});for(let n of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(n,e=>{if(up)up(e)})}bind($('b'),()=>press(0));bind($('r'),()=>press(1));bind($('twist'),()=>{held=true;$('twist').classList.add('on')},()=>{held=false;$('twist').classList.re )}g.setTransform(d,0,0,d,0,0);let W=r.width,H=r.height;g.clearRect(0,0,W,H);let floor=H-8,py=floor-23,base=Math.min(1,W/370,H/250),half=Math.min(W*.294,Math.max(1,(py-12)*.65)),camera=Math.min(1,Math.max(.01,(py-12-half*.30)/(12*32+144*base+8))),s=1.2*base*camera,unit=32*camera;g.fillStyle='#3d344e';g.fillRect(0,floor,W,H-floor);g.fillStyle='#9386aa';g.beginPath();g.moveTo(W/2,py);g.lineTo(W/2-16,floor);g.lineTo(W/2+16,floor);g.fill();g.save();g.translate(W/2,py);g.rotate(board);g.strokeStyle='#e6b66c';g.lineWidth=6*camera;g.lineCap='round';g.beginPath();for(let j=0;j<=40;j++){let u=j/20-1;let yy=flexAt(u)*camera;if(j===0)g.moveTo(u*half,yy);else g.lineTo(u*half,yy)}g.stroke();g.restore();for(let i=0;i<2;i++){let side=i===0?1:-1,u=side*.86,flex=flexAt(u)*camera-3*camera,x=W/2+u*half*Math.cos(board)-flex*Math.sin(board),y=py+u*half*Math.sin(board)+flex*Math.cos(board);let flying=phase==='air'&&active===i;let a=flying?angle:0;let pose=flying?tuck:phase==='contact'&&active===i?.65:.12;let age=(now-launchAt)/1000,hit=(now-impact[i])/1000;let arm=flying?(v<0?Math.PI*Math.max(0,Math.min(1,h/1.5)):Math.PI*Math.min(1,age*12))*(1-.75*tuck):Math.max(0,Math.PI*(1-hit*12));if(phase==='push'&&active===i){let k=Math.min(1,age/.18);arm=Math.PI*k;pose=.45*(1-k)}if(!flying&&hit<.25)pose=Math.max(pose,.65*(1-hit/.25));person(x,y-(flying?h*unit:0),i,a,pose,flying?tw:0,s,arm)}if(phase==='air'&&v<0||phase==='contact'){g.fillStyle='#8ff0a9';g.font='bold 17px system-ui';g.textAlign='center';g.fillText('TRYCK '+(active===0?'BLÅ':'RÖD'),W/2,25)}$('knob').style.top=(tuck*100)+'%'}function tick(ts){let dt=Math.min(.25,Math.max(0,(ts-(last||ts))/1000));last=ts;now=ts;if(start&&phase!=='done'){remaining=Math.max(0,60-(ts-start)/1000);$('clock').textContent=Math.ceil(remaining);$('clock').style.color=remaining<=10?'#ef7890':'white';if(remaining<=0&&phase!=='air'&&phase!=='push')finish()}if(now>showUntil)$('trick').style.opacity=0;tuck+=(target-tuck)*Math.min(1,dt*18);if(phase==='push'){let k=Mat
