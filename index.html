<!doctype html><html lang="sv"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>TEETER 3.1</title><style>*{box-sizing:border-box;touch-action:none;user-select:none}body{margin:0;background:#171728;color:white;font:16px system-ui;height:100dvh;display:flex;flex-direction:column}header{padding:8px 14px;display:flex;justify-content:space-between;color:#ffd18a;font-weight:bold}canvas{width:100%;flex:1;min-height:0}#controls{display:grid;grid-template-columns:1fr 90px 90px 1fr;gap:8px;padding:8px 12px max(12px,env(safe-area-inset-bottom));align-items:center}button{border:0;border-radius:12px;height:68px;font:bold 17px system-ui;color:#17202a}#a{background:#56d4dc}#b{background:#ff819a}#tw{background:#e8c477}#slide{height:104px;background:#38364c;border-radius:14px;position:relative;text-align:center;font-size:10px;padding:4px}#knob{position:absolute;left:25%;width:50%;height:24px;background:#ffd18a;border-radius:12px;top:17px}#hint{text-align:center;font-size:13px;color:#ddd;padding:3px} </style><header><span>TEETER 3.1</span><span id="stat">TRÄNING</span></header><canvas id="c"></canvas><div id="hint">Tryck HOPP 1 eller HOPP 2 för att börja</div><div id="controls"><button id="a">HOPP 1</button><div id="slide">STRÄCKT<div id="knob"></div><span style="position:absolute;bottom:3px;left:0;right:0">GRUPPERAD</span></div><button id="tw">SKRUV</button><button id="b">HOPP 2</button></div><script>
const c=document.querySelector('canvas'),g=c.getContext('2d'),hint=document.querySelector('#hint'),stat=document.querySelector('#stat'),slide=document.querySelector('#slide'),knob=document.querySelector('#knob');let tuck=0,target=0,tw=false,active=-1,h=0,v=0,rot=0,yaw=0,L=0,energy=2.8,angle=0,angV=0,clock=0,press=[-99,-99],combo=0,zoom=1,last=0,flash=0;const G=6.87,colors=['#56d4dc','#ff819a'];function launch(i,speed){active=i;h=.02;v=speed;rot=0;yaw=0;L=.12+Math.max(0,speed-3)*.25;clock=0;hint.textContent='Tajma nästa akrobat när den flygande landar';}function tap(i){press[i]=performance.now()/1000;if(active<0){energy=2.8;combo=0;launch(i,energy)}else if(i!==active){hint.textContent='Timing registrerad';}}document.querySelector('#a').onpointerdown=e=>tap(0);document.querySelector('#b').onpointerdown=e=>tap(1);function drag(e){let r=slide.getBoundingClientRect();target=Math.max(0,Math.min(1,(e.clientY-r.top-20)/(r.height-40)))}slide.onpointerdown=e=>{slide.setPointerCapture(e.pointerId);drag(e)};slide.onpointermove=e=>{if(slide.hasPointerCapture(e.pointerId))drag(e)};slide.onpointerup=slide.onpointercancel=()=>target=0;const twb=document.querySelector('#tw');twb.onpointerdown=e=>{twb.setPointerCapture(e.pointerId);tw=true};twb.onpointerup=twb.onpointercancel=()=>tw=false;function step(dt,t){tuck+=(target-tuck)*Math.min(1,dt*16);knob.style.top=(17+tuck*48)+'px';twb.style.opacity=tw?.65:1;let goal=0;angV+=(goal-angle)*40*dt-angV*7*dt;angle+=angV*dt;flash=Math.max(0,flash-dt);if(active>=0){clock+=dt;v-=G*dt;h+=v*dt;rot+=(active===0?-1:1)*L/(1-.76*tuck)*dt;if(tw)yaw+=dt*(4+4*tuck);if(h<=0&&v<0){let next=1-active,err=Math.abs(t-press[next]),quality=Math.max(0,1-err/.45),upright=Math.abs(Math.atan2(Math.sin(rot),Math.cos(rot))),clean=upright<1.1||energy<3.4;energy=Math.max(2.2,Math.min(10,(energy+(quality>.65?.55:quality>.25?.05:-.45))*(clean?1:.8)));combo=quality>.65&&clean?combo+1:0;hint.textContent=!clean?'Sned landning – energi förlorad':quality>.65?'PERFEKT TIMING!':quality>.25?'Bra timing':'Missad timing – lägre hopp';flash=.7;angV+=(active===0?-1:1)*Math.min(3,energy*.45);press[next]=-99;launch(next,energy);hint.textContent=!clean?'Sned landning – energi förlorad':quality>.65?'PERFEKT TIMING!':quality>.25?'Bra timing':'Missad timing – lägre hopp';}}stat.textContent='HÖJD '+(energy*energy/(2*G)).toFixed(1)+' m · COMBO '+combo;}
function line(x,y,a,b,w,col){g.strokeStyle=col;g.lineWidth=w;g.lineCap='round';g.beginPath();g.moveTo(x,y);g.lineTo(a,b);g.stroke()}function person(x,y,i,air){g.save();g.translate(x,y);g.rotate(air?rot:0);g.scale((i===0?1:-1)*(air?(.35+.65*Math.abs(Math.cos(yaw))):1),1);let k=air?tuck:0.15;let hip=-30+10*k,head=-65+20*k;line(0,0,10+12*k,-15-10*k,8,colors[i]);line(10+12*k,-15-10*k,0,hip,8,colors[i]);line(0,hip,8,head+12,12,colors[i]);line(7,head+16,20+10*k,hip-6,6,'#ffd3b0');g.fillStyle='#ffd3b0';g.beginPath();g.arc(9,head,9,0,7);g.fill();g.restore()}
function draw(){let r=c.getBoundingClientRect(),d=devicePixelRatio||1;if(c.width!==Math.round(r.width*d)||c.height!==Math.round(r.height*d)){c.width=Math.round(r.width*d);c.height=Math.round(r.height*d)}g.setTransform(d,0,0,d,0,0);let w=r.width,H=r.height;g.fillStyle='#242139';g.fillRect(0,0,w,H);let desired=Math.min(w/440,H/(160+energy*energy/(2*G)*95));zoom+=(desired-zoom)*.07;g.save();g.translate(w/2,H-38);g.scale(zoom,zoom);g.fillStyle='#706780';g.beginPath();g.moveTo(0,-35);g.lineTo(-28,0);g.lineTo(28,0);g.fill();g.save();g.translate(0,-35);g.rotate(angle);g.fillStyle='#dca75f';g.fillRect(-180,-5,360,10);g.restore();for(let i=0;i<2;i++){let side=i===0?-1:1,x=side*155,y=-35+Math.sin(angle)*x-5;person(x,y-(i===active?h*95:0),i,i===active)}g.restore();if(active>=0&&v<0){let remain=(v+Math.sqrt(v*v+2*G*Math.max(0,h)))/G;g.fillStyle=remain<.25?'#7affac':'#aaa';g.font='bold 15px system-ui';g.textAlign='center';g.fillText(remain<.25?'HOPP '+(2-active)+' NU!':'Nästa: HOPP '+(2-active),w/2,24)}}function loop(ms){let dt=Math.min(.025,(ms-(last||ms))/1000);last=ms;step(dt,ms/1000);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></html>
